name: FITGO Mobile CI

on:
  push:
    branches:
      - feat/fitgo-mobile-v1
    paths:
      - "mobile/**"
      - ".github/workflows/fitgo-mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/fitgo-mobile-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - name: Install dependencies
        run: npm install
      - name: Check Expo SDK dependency versions
        run: npx expo install --check
      - name: TypeScript validation
        run: npm run typecheck
      - name: Expo project diagnostics
        run: npx expo-doctor
